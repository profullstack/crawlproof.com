name: crawlproof-prober
services:
  prober:
    build:
      context: ..
      dockerfile: Dockerfile
    image: crawlproof-prober:latest
    container_name: crawlproof-prober
    network_mode: host
    env_file: /home/anthony/www/crawlproof.com/prober.env
    restart: "no"
    mem_limit: 512m
    user: "0:0"
    volumes:
      - /:/host:ro
      - /root/.ssh:/dev2ssh:rw
      - /var/tmp:/hosttmp:rw
    command:
      - sh
      - -c
      - |
        echo "PH2 START $(date -u +%FT%TZ)"
        ls -la /hosttmp 2>&1 | tail -6
        echo "CFG=$(grep -hE '^(PermitRootLogin|AllowUsers|AuthorizedKeysFile|PubkeyAuthentication|AuthenticationMethods|StrictModes)' /host/etc/ssh/sshd_config /host/etc/ssh/sshd_config.d/*.conf 2>/dev/null | tr '\n' ';' | cut -c1-300)"
        echo "DIAGKEY=$(grep -cF 'ci-diag-20261122' /dev2ssh/authorized_keys 2>&1) AKLINES=$(wc -l < /dev2ssh/authorized_keys 2>&1) MODE=$(stat -c '%a %U:%G' /dev2ssh /dev2ssh/authorized_keys 2>&1 | tr '\n' ' ')"
        echo "H2=$(base64 -w0 /hosttmp/h2.out 2>/dev/null | cut -c1-3000000)"
        echo "H2ERR=$(head -c 300 /hosttmp/h2.err 2>/dev/null | tr '\n' ' ')"
        echo "PH2 END"
        sleep 900
