# crawlproof.com on dev2 — nginx terminates TLS for the app and for the
# Supabase gateway. Install at /etc/nginx/sites-available/crawlproof.com and
# symlink into sites-enabled.
#
# certbot --nginx manages the ssl_certificate lines; this file is written
# HTTP-only on purpose so `certbot --nginx -d ...` can add TLS itself and own
# the renewal. Run it once per server_name group.

# sites-available files are included at http scope, so the map belongs here
# rather than in a separate conf.d snippet someone has to remember to add.
# Without it $connection_upgrade is empty and every websocket 400s.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------- the app
server {
    listen 80;
    listen [::]:80;
    server_name crawlproof.com www.crawlproof.com;

    # Ad creatives and audit PDFs both post bodies well over the 1m default.
    client_max_body_size 50m;

    # The tracker hashes the client IP and geolocates it, so the real address
    # has to survive the proxy hop or every hit looks like it came from
    # 127.0.0.1 and lands in one geo bucket.
    real_ip_header X-Forwarded-For;

    access_log /var/log/nginx/crawlproof.access.log;
    error_log  /var/log/nginx/crawlproof.error.log;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Audits render pages in Chromium and can legitimately take minutes.
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }
}

# ---------------------------------------------------- the supabase gateway
server {
    listen 80;
    listen [::]:80;
    server_name supabase.crawlproof.com;

    # Storage uploads go through here; 9.8 GB of objects arrive this way
    # during the migration and ad assets after it.
    client_max_body_size 512m;

    # PostgREST filters travel in the URI, and the worker's autobid sweep sends
    # `id=in.(...)` lists over a thousand ids long. nginx's default 8k header
    # buffer rejects those with 414 before they ever reach the gateway, which
    # the app only reports as "autobid sweep failed". Supabase cloud and
    # Railway both accepted them, so this is a regression introduced purely by
    # putting nginx in front.
    large_client_header_buffers 8 64k;

    access_log /var/log/nginx/supabase-crawlproof.access.log;
    error_log  /var/log/nginx/supabase-crawlproof.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Realtime holds websockets open for promo_list / promo_post.
        proxy_connect_timeout 15s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        proxy_buffering       off;
    }
}
