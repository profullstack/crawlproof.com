# Per-tenant guardrails for the shared supabase-db on dev2.
# Applied by: setup-supabase.sh --tenants-only   (no restart; new sessions only)
# Preview:    setup-supabase.sh --print-tenants-sql <db>...
#
# Columns:
#   db                  database name, or * for every database not listed
#   role                the role the tenant connects as (all of them: postgres)
#   conn_limit          ALTER DATABASE ... CONNECTION LIMIT; - = unlimited
#   statement_timeout   ALTER ROLE <role> IN DATABASE <db> SET ...; - = unset
#   idle_in_tx_timeout  idle_in_transaction_session_timeout;        - = unset
#   lock_timeout        - = unset
# Durations need a unit (ms, s, min, h, d), or 0 for "explicitly off".
#
# postgres, _supabase and the templates are shared infrastructure and are never
# touched; listing one is an error.
#
# How the numbers were picked (measured on dev2, 2026-10-01, read-only):
#   - Connections: rssamplifier peaked at 126 (41 just after the 09:22 restart),
#     nichedb runs DB_POOL_MAX=40 (24 open), every other tenant held 0-10.
#     Limits are ~1.5-2x peak so a rolling deploy, which briefly runs old and
#     new containers side by side, never hits them. 300 max_connections is not
#     meant to be divisible by these: the limit stops ONE tenant eating the
#     cluster, not the sum.
#   - NOTE every tenant connects as `postgres`, a superuser, and Postgres does
#     not enforce CONNECTION LIMIT against superusers. These limits are recorded
#     and bind once a tenant moves to its own non-superuser role; until then the
#     enforceable cap is the Supavisor pool (README, "Connection pooling").
#   - Statements: pg_stat_statements' slowest so far was 101 s in nichedb and
#     11 s in rssamplifier; every other tenant was under 2 s. The timeouts are
#     an order of magnitude above that, and they also govern migrations apps
#     run on boot as `postgres`, so they are deliberately generous. A migration
#     that needs longer sets `statement_timeout = 0` in its own session.
#   - lock_timeout is left unset: statement_timeout already bounds every wait,
#     and a short lock_timeout would fail a boot-time migration's ALTER TABLE
#     queued behind ordinary traffic, i.e. fail the deploy.
#
# db             role      conn_limit  statement_timeout  idle_in_tx_timeout  lock_timeout
*                postgres  40          5min               10min               -
rssamplifier     postgres  200         15min              10min               -
nichedb          postgres  100         1h                 10min               -
