name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    name: test + typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install (root)
        run: npm ci --no-audit --no-fund

      - name: Install (worker)
        run: cd worker && npm install --no-audit --no-fund

      # The five-second ad renderer encodes with ffmpeg and validates with
      # ffprobe. tests/ads-video-pipeline.test.ts skips itself when they are
      # absent, so without this step the one test that proves a pre-roll
      # actually decodes to 150 frames would quietly never run here — and a
      # green check would say nothing about it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify ffmpeg is present for the render tests
        run: ffmpeg -version && ffprobe -version

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Typecheck (worker)
        run: cd worker && npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Ad reporting and crawler limits (PostgreSQL + Redis)
        run: |
          node scripts/test-ad-token-earnings.mjs
          node --import tsx scripts/test-crawl-limits.mjs
